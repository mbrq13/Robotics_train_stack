# Station endpoint.
station_url: ws://192.168.55.100:8765
# Task instruction for language-conditioned policies.
task: ""
device: cuda
schema_version: 1
# Representation expected by the checkpoint and hardware station profile.
action_space: radians
robot_type: piper
# `sync` is the universal one-call-per-tick mode. Use `rtc` only with a
# checkpoint trained for RTC. The former name `standard` remains accepted.
execution_mode: sync
rtc_execution_horizon: 10
rtc_refill_threshold: 10
# Explicit state ordering for checkpoints that omit semantic names.
state_names:
  - left_joint_1
  - left_joint_2
  - left_joint_3
  - left_joint_4
  - left_joint_5
  - left_joint_6
  - left_gripper
  - right_joint_1
  - right_joint_2
  - right_joint_3
  - right_joint_4
  - right_joint_5
  - right_joint_6
  - right_gripper
